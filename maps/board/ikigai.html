<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ikigai</title>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<main>
  <p><a href="index.html">Quadro de mapas</a></p>
  <h1>Ikigai</h1>
  <p class="nota">Modelo em branco, desenhado para este modelo. Para um retrato, o assistente copia esta página para <code>ikigai-AAAA-MM-DD.html</code>, ao lado, e escreve dentro de cada círculo os itens do arquivo <code>maps/ikigai/AAAA-MM-DD.md</code>.</p>
  <div class="figura">
    <svg viewBox="0 0 640 640" role="img" aria-labelledby="ikigai-titulo">
      <title id="ikigai-titulo">Ikigai em branco: quatro círculos que se cruzam</title>
      <g fill-opacity="0.12" stroke-width="2">
        <circle cx="320" cy="215" r="150" fill="var(--q1)" stroke="var(--q1)"/>
        <circle cx="425" cy="320" r="150" fill="var(--q2)" stroke="var(--q2)"/>
        <circle cx="320" cy="425" r="150" fill="var(--q3)" stroke="var(--q3)"/>
        <circle cx="215" cy="320" r="150" fill="var(--q4)" stroke="var(--q4)"/>
      </g>
      <g font-size="15" font-weight="700" text-anchor="middle">
        <text x="320" y="120">O que eu amo</text>
        <text x="520" y="325">Em que sou bom</text>
        <text x="320" y="530">Pelo que podem me pagar</text>
        <text x="120" y="325">O que o mundo precisa</text>
      </g>
      <g font-size="12" text-anchor="middle" fill="var(--apoio)">
        <text x="385" y="250" style="fill: var(--apoio)">paixão</text>
        <text x="385" y="400" style="fill: var(--apoio)">profissão</text>
        <text x="255" y="400" style="fill: var(--apoio)">vocação</text>
        <text x="255" y="250" style="fill: var(--apoio)">missão</text>
      </g>
      <circle cx="320" cy="320" r="26" fill="var(--superficie)" stroke="var(--acento)" stroke-width="2"/>
      <text x="320" y="325" font-size="13" font-weight="700" text-anchor="middle" style="fill: var(--acento)">ikigai</text>
    </svg>
  </div>
</main>
</body>
</html>
