<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O fluxo por issue</title>
<link rel="stylesheet" href="tokens.css">
<!-- O motor de layout: ELK (layered) 0.12.1, embutido ao lado (sem rede); licença EPL-2.0 em elk-LICENSE.md. -->
<script src="elk.bundled.js"></script>
<style>
  /* Os espaçamentos que o motor lê (o desenho decide aqui, o motor obedece). */
  :root {
    --no-largura: 188px;     /* largura mínima do cartão; a altura sai do HTML medido */
    --no-largura-max: 236px; /* até onde o cartão alarga quando sobra coluna */
    --no-faixa: 30px;        /* a faixa acima do cartão onde mora o rótulo do grupo */
    --esp-camada: 36px;      /* entre colunas (camadas) */
    --esp-no: 44px;          /* entre nós da mesma coluna e entre as linhas quebradas */
    --esp-aresta: 14px;      /* entre arestas paralelas */
    --esp-aresta-no: 18px;   /* entre aresta e nó */
    --esp-rotulo: 4px;       /* entre o rótulo e a sua aresta */
    --raio-curva: 8px;       /* o arredondado das dobras das setas */
    --raio-laco: 10px;       /* o arredondado do laço da recusa, um pouco mais aberto que as dobras */
    --folga-rotulo: 10px;    /* o respiro de cada lado do rótulo de uma seta de avanço */
    --fundo-laco: 10px;      /* o quanto o laço da recusa desce além do rótulo (a mais no espaço que o motor reserva) */
    --raio-juncao: 3.5px;    /* o ponto onde um ramo paralelo se divide ou se junta */
    --porta-y: 26px;         /* a altura (do topo do cartão) onde a seta de avanço sai e entra: a linha do título */
    --largura-lista: 720px;  /* abaixo desta largura, a figura vira a lista dos passos (o celular) */
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 40px 16px 48px; box-sizing: border-box; }
  figure { margin: 0; }

  /* Cabeçalho: título e legenda fora do grafo, em flexbox. */
  .cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 40px;
         padding-bottom: 20px; border-bottom: 1px solid var(--linha); margin-bottom: 8px; }
  .sobre { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
  .cab h2 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; color: var(--tinta); }
  .legenda { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--suave); }
  .legenda li { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .amostra { width: 14px; height: 14px; border-radius: 4px; box-sizing: border-box; flex: none; }
  .amostra.pessoa { background: var(--destaque-fundo); border: 1.5px solid var(--destaque); }
  .amostra.maquina { background: var(--alerta-fundo); border: 1.5px solid var(--alerta); }
  .amostra-fio { width: 32px; height: 12px; flex: none; }
  .amostra-fio line { stroke-width: 1.75; }

  /* O grafo: o motor posiciona; cartões em HTML por cima das setas em SVG. */
  .grafo { position: relative; margin: 0 auto; }
  .grafo > svg { position: absolute; inset: 0; overflow: visible; }
  .medida { position: absolute; visibility: hidden; left: -9999px; top: 0; }

  .no { position: absolute; box-sizing: border-box; width: var(--no-largura); display: flex; flex-direction: column; gap: 6px;
        padding: 14px 14px 14px; background: var(--papel); border: 1.5px solid var(--linha); border-radius: 12px; color: var(--tinta); }
  .no.pessoa { background: var(--destaque-fundo); border-color: var(--destaque); }
  .no.maquina { background: var(--alerta-fundo); border-color: var(--alerta); }
  .no-topo { display: flex; align-items: flex-start; gap: 10px; }
  .num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; margin-top: -1px;
         font-size: 13px; font-weight: 700; line-height: 1; background: var(--papel); border: 1.5px solid var(--linha); color: var(--tinta); box-sizing: border-box; }
  .no.pessoa .num { border-color: var(--destaque); color: var(--destaque); }
  .no.maquina .num { border-color: var(--alerta); color: var(--alerta); }
  .no h3, .no p { text-wrap: pretty; }
  .no h3 { margin: 0; font-size: 15px; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere; }
  .no p { margin: 0; font-size: 13px; line-height: 1.4; color: var(--suave); overflow-wrap: anywhere; }
  .no .selo { align-self: flex-start; margin-top: auto; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
              line-height: 1; padding: 6px 9px 5px; border-radius: 999px; background: var(--linha); color: var(--tinta); white-space: nowrap; }
  .no.pessoa .selo { background: var(--destaque); color: var(--papel); }
  .no.maquina .selo { background: var(--alerta); color: var(--papel); }
  .no.entrada { border-color: var(--linha); background: transparent; }
  .no.entrada .num { border: 0; background: none; width: auto; height: auto; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
  .espaco-selo { margin-top: auto; }
  code, .mono { font-family: var(--mono); font-size: .95em; }

  .rotulo-aresta { position: absolute; box-sizing: border-box; padding: 2px 6px; font-size: 12px; line-height: 16px; white-space: nowrap;
                   color: var(--suave); background: var(--fundo); border-radius: 4px; }
  .rotulo-aresta.recusa { color: var(--alerta); font-weight: 600; }
  .rotulo-aresta.volta { color: var(--suave); font-style: italic; }
  .rotulo-aresta.avanco { color: var(--tinta); }
  .rotulo-aresta.laco { background: none; padding: 0 2px; }
  .rotulo-grupo { position: absolute; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
                  color: var(--suave); white-space: nowrap; padding-right: 14px; background: var(--fundo); }

  .aresta { fill: none; stroke-width: 1.75; stroke-linejoin: round; }
  .aresta.avanco { stroke: var(--suave); stroke-width: 2; }
  .juncao { fill: var(--suave); }
  .aresta.recusa { stroke: var(--alerta); stroke-dasharray: 5 4; }
  .aresta.volta { stroke: var(--suave); stroke-dasharray: 5 4; }
  .ponta.avanco { fill: var(--suave); }
  .ponta.recusa { fill: var(--alerta); }
  .ponta.volta { fill: var(--suave); }
  .chave { fill: none; stroke: var(--linha); stroke-width: 1.5; }

  /* A versão: a linha do main com o corte da tag (fora do grafo). A fileira de baixo é flexbox;
     a linha de cima se desenha depois, a partir de onde a tag caiu. */
  .versao { margin-top: 28px; background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 22px 28px 24px; }
  .versao-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 24px; }
  .versao-cab .sobre { margin: 0; }
  .versao-cab .quando { margin: 0; font-size: 13px; color: var(--suave); }
  .trilho { position: relative; }
  .trilho > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .faixa-main { height: 64px; position: relative; }
  .main-nome { position: absolute; left: 0; bottom: 8px; font-family: var(--mono); font-weight: 700; font-size: 14px; line-height: 16px; color: var(--tinta); }
  .marca-squash { position: absolute; top: 4px; display: flex; align-items: center; gap: 8px; white-space: nowrap; transform: translateX(-50%);
                  font-size: 13px; line-height: 18px; font-weight: 700; color: var(--tinta); }
  .marca-squash .num { width: 22px; height: 22px; font-size: 12px; background: var(--alerta-fundo); border-color: var(--alerta); color: var(--alerta); }
  .marca-seguinte { position: absolute; top: 6px; }
  .corte { display: flex; flex-wrap: nowrap; align-items: center; gap: 14px 6px; padding-top: 26px; }
  .portas { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; }
  .porta { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--tinta); white-space: nowrap;
           background: var(--alerta-fundo); border: 1.5px solid var(--alerta); border-radius: 999px; padding: 5px 12px 5px 9px; }
  .porta svg path { stroke: var(--alerta); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .seta-curta { width: 16px; height: 10px; flex: none; }
  .seta-curta path { stroke: var(--suave); stroke-width: 1.75; fill: none; }
  .versao-tag { display: flex; align-items: center; gap: 10px; }
  .tag { font-family: var(--mono); font-weight: 700; font-size: 14px; line-height: 16px; padding: 8px 14px 8px 22px;
         background: var(--tinta); color: var(--papel); clip-path: polygon(11px 0, 100% 0, 100% 100%, 11px 100%, 0 50%); }
  .tag.seguinte { background: none; color: var(--suave); clip-path: none; padding: 6px 14px 6px 22px; position: relative; }
  .tag.seguinte svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tag.seguinte svg path { fill: none; stroke: var(--suave); stroke-width: 1.5; stroke-dasharray: 0.5 4; stroke-linecap: round; }
  .nota { font-size: 13px; line-height: 18px; color: var(--suave); white-space: nowrap; }
  .nota b { color: var(--tinta); font-weight: 700; }
  .empurra { flex: 0 1 140px; min-width: 40px; }
  .resto { flex: 1 1 0; }
  .trilho .linha { stroke: var(--tinta); stroke-width: 3; stroke-linecap: round; }
  .trilho .ponta-main { fill: var(--tinta); }
  .trilho .commit { fill: var(--papel); stroke: var(--suave); stroke-width: 2; }
  .trilho .commit.forte { stroke: var(--tinta); stroke-width: 3; }
  .trilho .haste { stroke: var(--tinta); stroke-width: 2; }
  .trilho .haste.seguinte { stroke: var(--suave); stroke-dasharray: 0.5 4; stroke-linecap: round; }

  figcaption { margin-top: 18px; max-width: 78ch; font-size: 14px; color: var(--suave); }

  /* A lista dos passos: lida pelo leitor de tela ao lado da figura, e mostrada no lugar dela na tela estreita. */
  .so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .passos { margin: 0; padding: 0; list-style: none; }
  .estreita .grafo, .estreita .versao { display: none; }
  .estreita .passos { position: static; width: auto; height: auto; overflow: visible; clip: auto; clip-path: none; white-space: normal;
                      display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .estreita .passos li { background: var(--papel); border: 1.5px solid var(--linha); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--suave); }
  .estreita .passos li.pessoa { background: var(--destaque-fundo); border-color: var(--destaque); }
  .estreita .passos li.maquina { background: var(--alerta-fundo); border-color: var(--alerta); }
  .estreita .passos li b { display: block; color: var(--tinta); font-size: 15px; }
  .estreita .passos li.liga { background: none; border: 0; padding: 0 14px; font-size: 13px; }
  .estreita .passos li.liga.recusa { color: var(--alerta); }
  /* O erro à vista: o dado que não serve diz qual é a causa, na página e não só no console. */
  .erro-diagrama { margin-top: 16px; border: 1.5px solid var(--alerta); background: var(--alerta-fundo); color: var(--tinta);
                   border-radius: 12px; padding: 16px 18px; font-size: 14px; }
  .erro-diagrama b { display: block; margin-bottom: 6px; }
  .erro-diagrama ul { margin: 6px 0 0; padding-left: 18px; }
  .amostra-ponto { width: 14px; height: 14px; flex: none; }
</style>
</head>
<body>
<main>
<figure id="figura">
  <header class="cab">
    <div><p class="sobre" id="sobretitulo"></p><h2 id="titulo"></h2></div>

  </header>
  <div class="grafo" id="grafo" role="img"></div>
  <ol class="passos so-leitor" id="passos" aria-label="Os passos, em texto"></ol>
  <section class="versao" id="versao"></section>
  <figcaption id="legenda-texto"></figcaption>
</figure>
</main>

<script>
(async function () {
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const classeTipo = t => ({ 'pessoa': 'pessoa', 'máquina': 'maquina', 'neutro': 'neutro' })[t] || 'neutro';
  const classeAresta = t => ({ 'avanço': 'avanco', 'recusa': 'recusa', 'volta': 'volta' })[t] || 'avanco';

  // 1. O conteúdo como dado.
  const fonte = new URLSearchParams(location.search).get('dados') || 'fluxo.json';
  let D;
  try { const r = await fetch(fonte, { cache: 'no-store' }); if (!r.ok) throw 0; D = await r.json(); }
  catch (e) { D = JSON.parse($('#dados-embutidos').textContent); }
  // 1b. O dado se confere antes do layout: o erro diz a causa (o id que não existe, o campo que falta), e não a
  //     consequência que o motor daria ("nenhuma quebra cabe"). A lista de erros vai à página (passo 8).
  const TIPOS_NO = ['pessoa', 'máquina', 'neutro'], TIPOS_ARESTA = ['avanço', 'recusa', 'volta'];
  const erros = [];
  const texto = (v, onde) => { if (typeof v !== 'string' || !v.trim()) erros.push(`${onde}: falta o texto`); };
  if (!D || typeof D !== 'object') throw Object.assign(new Error('o dado não é um objeto JSON'), { dados: ['o dado não é um objeto JSON'] });
  texto(D.titulo, 'titulo'); texto(D.afirmacao, 'afirmacao');
  for (const k of ['nos', 'arestas', 'grupos']) if (!Array.isArray(D[k])) erros.push(`${k}: falta a lista`);
  if (!D.legenda || typeof D.legenda !== 'object') erros.push('legenda: falta o objeto (pessoa, máquina, recusa, volta)');
  else if (Array.isArray(D.nos) && Array.isArray(D.arestas)) {
    const usados = new Set([...D.nos.map(n => n && n.tipo), ...D.arestas.map(a => a && a.tipo)]);
    for (const k of ['pessoa', 'máquina', 'recusa', 'volta']) if (usados.has(k)) texto(D.legenda[k], `legenda.${k}`);
  }
  if (!erros.some(x => /^(nos|arestas|grupos):/.test(x))) {
    if (!D.nos.length) erros.push('nos: a lista está vazia');
    const gids = new Set(D.grupos.map(g => g.id)), ids = new Set();
    D.grupos.forEach((g, k) => { texto(g.id, `grupos[${k}].id`); texto(g.rotulo, `grupos[${k}].rotulo`); });
    D.nos.forEach((n, k) => { const onde = `nos[${k}]` + (n && n.id ? ` (${n.id})` : '');
      texto(n.id, onde + '.id'); if (ids.has(n.id)) erros.push(`${onde}: o id "${n.id}" se repete`); ids.add(n.id);
      texto(n.titulo, onde + '.titulo');
      if (!TIPOS_NO.includes(n.tipo)) erros.push(`${onde}.tipo: "${n.tipo}" não é ${TIPOS_NO.join(', ')}`);
      if (!gids.has(n.grupo)) erros.push(`${onde}.grupo: o grupo "${n.grupo}" não existe em grupos`); });
    D.arestas.forEach((a, k) => { const onde = `arestas[${k}] (${a.de} → ${a.para})`;
      for (const lado of ['de', 'para']) if (!ids.has(a[lado])) erros.push(`${onde}: o passo "${a[lado]}" (em ${lado}) não existe em nos`);
      if (!TIPOS_ARESTA.includes(a.tipo)) erros.push(`${onde}.tipo: "${a.tipo}" não é ${TIPOS_ARESTA.join(', ')}`);
      if (a.tipo === 'avanço' && a.de === a.para) erros.push(`${onde}: o avanço não volta ao próprio passo (o laço é "recusa")`); });

    for (const s of e.sections || []) {

      if (pts.length && Math.hypot(pts[pts.length - 1].x - seq[0].x, pts[pts.length - 1].y - seq[0].y) < 0.5) seq.shift();
      pts.push(...seq);
    }
    // tira pontos repetidos e colineares
    pts = pts.filter((p, k) => k === 0 || Math.hypot(p.x - pts[k - 1].x, p.y - pts[k - 1].y) > 0.5);
    pts = pts.filter((p, k) => { if (k === 0 || k === pts.length - 1) return true; const a1 = pts[k - 1], c1 = pts[k + 1];
      return Math.abs((p.x - a1.x) * (c1.y - p.y) - (p.y - a1.y) * (c1.x - p.x)) > 0.01; });
    const lb = (e.labels || [])[0];
    let d, rot = null;
    if (a.de === a.para) {
      // O laço se desenha aqui, não pela rota do motor: as duas pernas nas portas que o motor respeitou, o fundo no
      // pé do espaço que ele reservou para o rótulo, e o rótulo dentro do laço, entre as pernas.
      const yb = pts[0].y, xo = pts[0].x, xi = pts[pts.length - 1].x;
      const yl = Math.max(...pts.map(p => p.y), lb ? lb.y + lb.height : 0);
      d = lacoCaminho(xo, xi, yb, yl);
      if (rotulos[i]) { rot = rotulos[i]; rot.el.classList.add('laco');
        rot.el.style.left = ((xo + xi) / 2 - rot.w / 2) + 'px'; rot.el.style.top = (yb + (yl - yb - rot.h) / 2) + 'px'; }
    } else {
      d = caminho(pts);
      if (rotulos[i] && lb) { rot = rotulos[i]; rot.el.style.left = (lb.x + dx) + 'px'; rot.el.style.top = lb.y + 'px'; }
      else if (rotulos[i]) { // o rótulo do avanço, sobre o trecho horizontal mais longo, centrado nele
        const m = trechoLongo(pts);
        // no trecho longo (a volta de uma fileira para a outra), o rótulo fica perto de onde a seta sai, para se ler
        // com o passo que a manda (rodada 2: no canto da chegada, ele ficava solto); entre duas colunas, centrado
        if (m) { rot = rotulos[i];
          const perto = m.l >= rot.w + 2 * FOLGA + 48, lado = Math.sign(m.p.x - m.q.x) || 1;
          const cx = perto ? m.p.x - lado * (FOLGA + 24 + rot.w / 2) : m.x;
          rot.el.style.left = (cx - rot.w / 2) + 'px'; rot.el.style.top = (m.y - rot.h - 3) + 'px'; }
      }
    }
    const path = sv('path', { d, class: 'aresta ' + t, 'marker-end': `url(#ponta-${t})` });
    path.dataset.de = a.de; path.dataset.para = a.para; path.dataset.tipo = a.tipo; path.dataset.indice = String(i);
    if (a.de === a.para) path.dataset.laco = '1';
    gArestas.append(path); rotas[i] = pts;
    if (rot) { rot.el.dataset.aresta = String(i); grafo.append(rot.el); }
  }
  const pos = {};
  for (const c of L.children) {
    pos[c.id] = { x: c.x + dx, y: c.y };
    const k = cartoes[c.id]; k.style.left = (c.x + dx) + 'px'; k.style.top = (c.y + FAIXA) + 'px'; grafo.append(k);
  }
  // Grupos: uma chave sobre os cartões do grupo, por fileira (se a quebra partir o grupo, cada parte ganha a sua).
  // A fileira é a do layout (os ramos paralelos empilhados contam como uma), e a chave fica sobre o mais alto.
  const filDe = {}; fileirasDe(L).forEach((f, k) => f.ids.forEach(id => filDe[id] = k));
  for (const g of D.grupos) {
    const fileiras = {};
    nos.filter(n => n.grupo === g.id).forEach(n => (fileiras[filDe[n.id]] = fileiras[filDe[n.id]] || []).push(pos[n.id]));
    Object.keys(fileiras).map(Number).sort((a, b) => a - b).forEach((kf, k) => { const f = fileiras[kf];
      const x0 = Math.min(...f.map(p => p.x)), x1 = Math.max(...f.map(p => p.x)) + W, y = Math.min(...f.map(p => p.y));
      const rot = el('div', 'rotulo-grupo', g.rotulo + (k > 0 ? ' (cont.)' : ''));
      rot.style.left = x0 + 'px'; rot.style.top = (y + FAIXA - 24) + 'px'; grafo.append(rot);
      const yl = y + FAIXA - 16;
      gChaves.append(sv('path', { class: 'chave', d: `M${x0 + 1},${yl + 6} V${yl} H${x1 - 1} V${yl + 6}` }));
    });
  }
  // O ramo paralelo: um ponto onde as setas de avanço de um passo se dividem e outro onde as de outro se juntam.
  // O ponto fica na primeira dobra (na divisão) ou na última (na junção), na altura da porta.
  const gJuncoes = sv('g'); svg.append(gJuncoes);
  const avancoIdx = D.arestas.map((a, i) => i).filter(i => D.arestas[i].tipo === 'avanço' && D.arestas[i].de !== D.arestas[i].para && rotas[i]);
  const ponto = (x, y, id) => { const c = sv('circle', { class: 'juncao', cx: x, cy: y, r: tok('--raio-juncao') }); c.dataset.juncao = id; gJuncoes.append(c); };
  for (const n of nos) {
    const sai = avancoIdx.filter(i => D.arestas[i].de === n.id), chega = avancoIdx.filter(i => D.arestas[i].para === n.id);
    if (sai.length > 1) { const p0 = rotas[sai[0]][0];
      const dobras = sai.map(i => rotas[i]).filter(r => r.length > 2 && Math.abs(r[1].y - r[0].y) < 0.5).map(r => r[1].x);
      ponto(dobras.length ? Math.min(...dobras) : p0.x, p0.y, n.id + '.divide'); }
    if (chega.length > 1) { const r0 = rotas[chega[0]], pf = r0[r0.length - 1];
      const dobras = chega.map(i => rotas[i]).filter(r => r.length > 2 && Math.abs(r[r.length - 2].y - r[r.length - 1].y) < 0.5).map(r => r[r.length - 2].x);
      ponto(dobras.length ? Math.max(...dobras) : pf.x, pf.y, n.id + '.junta'); }
  }
  medida.remove();

  // 7. A versão: a fileira do corte em flexbox; a linha do main desenhada depois, alinhada às tags.
  const V = D.versao, ver = $('#versao');
  if (!V) { ver.remove(); document.body.dataset.pronto = '1'; return; }
  const origem = porId[V.origem];
  const cab = el('div', 'versao-cab'); cab.append(el('p', 'sobre', V.rotulo), el('p', 'quando', V.quando)); ver.append(cab);
  const tr = el('div', 'trilho'); ver.append(tr);
  const faixa = el('div', 'faixa-main'); faixa.append(el('span', 'main-nome', 'main')); tr.append(faixa);
  const marca = el('div', 'marca-squash'); marca.append(el('span', 'num', String(origem.numero)), el('span', null, 'o squash da issue')); faixa.append(marca);
  const corte = el('div', 'corte'); tr.append(corte);
  const check = () => { const s = sv('svg', { width: 12, height: 12, viewBox: '0 0 12 12' }); s.append(sv('path', { d: 'M2,6.5 L5,9.2 L10,3' })); return s; };
  const setinha = () => { const s = sv('svg', { class: 'seta-curta', viewBox: '0 0 16 10' }); s.append(sv('path', { d: 'M1,5 H14 M10.5,1.5 L14,5 L10.5,8.5' })); return s; };
  const ps = el('div', 'portas');
  V.portas.forEach(t => { const p = el('span', 'porta'); p.append(check(), el('span', null, t)); ps.append(p, setinha()); });
  const vt = el('div', 'versao-tag'); const tag = el('span', 'tag', V.tag);
  const nota = el('span', 'nota'); nota.append(el('b', null, V.imovel), document.createTextNode(' · ' + V.tag_nota));
  vt.append(tag, nota);
  const vs = el('div', 'versao-tag'); const tag2 = el('span', 'tag seguinte', V.seguinte);
  const contorno = sv('svg', { preserveAspectRatio: 'none' }); tag2.prepend(contorno);
  vs.append(tag2);
  const marca2 = el('div', 'marca-seguinte nota', V.seguinte_nota); faixa.append(marca2);
  corte.append(ps, vt, el('span', 'empurra'), vs, el('span', 'resto'));

  const desenhaMain = () => {
    tr.querySelectorAll(':scope > svg').forEach(x => x.remove());
    const R = tr.getBoundingClientRect(), rr = e => { const b = e.getBoundingClientRect(); return { x: b.left - R.left, y: b.top - R.top, w: b.width, h: b.height }; };
    const t1 = rr(tag), t2 = rr(tag2), nm = rr(tr.querySelector('.main-nome'));
    const yl = nm.y + nm.h / 2, x0 = nm.x + nm.w + 12, xf = R.width;
    const s = sv('svg', { width: R.width, height: R.height, 'aria-hidden': 'true' });
    s.append(sv('line', { class: 'linha', x1: x0, y1: yl, x2: xf - 8, y2: yl }), sv('path', { class: 'ponta-main', d: `M${xf - 10},${yl - 6} L${xf},${yl} L${xf - 10},${yl + 6} z` }));
    const xs = t1.x + 11 + (t1.w - 11) / 2, xn = t2.x + 11 + (t2.w - 11) / 2; // o meio do corpo da tag (sem o bico)
    s.append(sv('line', { class: 'haste', x1: xs, y1: yl, x2: xs, y2: t1.y }), sv('line', { class: 'haste seguinte', x1: xn, y1: yl, x2: xn, y2: t2.y }));
    const n = 4; for (let k = 1; k <= n; k++) { const x = x0 + (xs - x0) * k / (n + 1); s.append(sv('circle', { class: 'commit', cx: x, cy: yl, r: 5 })); }
    s.append(sv('circle', { class: 'commit', cx: (xs + xn) / 2, cy: yl, r: 5 }));
    s.append(sv('circle', { class: 'commit forte', cx: xs, cy: yl, r: 9 }), sv('circle', { class: 'commit', cx: xn, cy: yl, r: 6 }));
    tr.prepend(s);
    marca.style.left = xs + 'px';
    const w2 = marca2.offsetWidth; marca2.style.left = Math.min(xn - w2 / 2, R.width - w2) + 'px';
    const w = tag2.offsetWidth, h = tag2.offsetHeight;
    contorno.setAttribute('viewBox', `0 0 ${w} ${h}`);
    contorno.innerHTML = `<path d="M11,0.75 H${w - 4.75} Q${w - 0.75},0.75 ${w - 0.75},4.75 V${h - 4.75} Q${w - 0.75},${h - 0.75} ${w - 4.75},${h - 0.75} H11 L0.75,${h / 2} Z"/>`;
  };
  desenhaMain();

  document.body.dataset.pronto = '1';
})().catch(err => {
  document.body.dataset.pronto = 'erro'; document.body.dataset.erro = String(err && err.stack || err); console.error(err);
  // 8. O erro à vista: a caixa no lugar da figura, com a causa (a lista do dado, quando o erro é de dado).
  const fig = document.querySelector('#figura'), box = document.createElement('div'); box.className = 'erro-diagrama'; box.setAttribute('role', 'alert');
  const b = document.createElement('b'); b.textContent = 'O diagrama não saiu.'; box.append(b);
  const itens = err && err.dados ? err.dados : [String(err && err.message || err)];
  const ul = document.createElement('ul'); for (const t of itens) { const li = document.createElement('li'); li.textContent = t; ul.append(li); } box.append(ul);
  fig.querySelectorAll('.grafo, .versao').forEach(e => e.remove()); fig.append(box);
});
</script>
<script>
/* Dentro de um iframe (o onboarding do projeto embute os diagramas), a página diz a altura dela ao pai quando fica pronta
   e quando muda de largura, para o iframe crescer sem barra de rolagem. Por postMessage, que vale também em file://. */
(function () {
  if (window.parent === window) return;
  const avisar = () => parent.postMessage({ diagrama: 'altura', altura: document.documentElement.scrollHeight }, '*');
  new MutationObserver(() => { if (document.body.dataset.pronto) avisar(); })
    .observe(document.body, { attributes: true, attributeFilter: ['data-pronto'] });
  window.addEventListener('resize', () => { if (document.body.dataset.pronto) avisar(); });
})();
</script>
