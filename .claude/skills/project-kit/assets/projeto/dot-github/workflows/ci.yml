name: CI

# Em todo PR e em todo push ao {{BASE}} (o commit que vai direto ao {{BASE}} não passa pelo PR).
# Da falha mais barata à mais cara: as travas e o log (só Python, sem instalar nada), o formato, o lint,
# o smoke e os testes. A bateria inteira roda antes de cada versão, fora daqui (knowledge/versao-e-dependencias.md).
# Só as ações oficiais (actions/*), fixadas pelo hash do commit, com a versão no comentário; o Dependabot de segurança
# avisa quando uma delas tem alerta. Ação de terceiros não entra: o passo que precisaria dela vai como comando.
# O teto é de 3 minutos: passou, o CI falha, e o passo lento se revê antes de subir o teto.
# Filtro por caminho (paths) não vai no gatilho: este é o check obrigatório do PR, e o PR que não casa com o filtro
# fica esperando um check que nunca roda, sem poder entrar. O passo que só vale para parte dos arquivos filtra dentro
# do job (git diff contra a base), e o job termina verde.
on:
  pull_request:
  push:
    branches: [{{BASE}}]
  workflow_dispatch:

permissions:
  contents: read

# No PR, o push novo cancela o run superado (ninguém lê o resultado de um commit que já mudou). No {{BASE}}, cada commit
# roda até o fim: é o run que prova o que vai virar versão.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: As travas do fluxo (os testes)
        run: python3 -m unittest discover -s .claude/hooks -p "test_*.py" && python3 -m unittest discover -s .githooks -p "test_*.py"
      - name: O log da base no formato
        run: python3 .githooks/hooks.py log
      - name: Os diagramas do onboarding no esquema
        run: python3 onboarding/diagramas/esquema.py onboarding/diagramas/*.html
      - name: Os scripts do CI (os testes)
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      # O roteador e a base contra o repositório: os caminhos e os comandos do CLAUDE.md existem, os passos daqui são os
      # que ele lista, as páginas do índice existem. A página órfã e o código que a base cita e saiu são só aviso.
      - name: O roteador e a base sem deriva
        run: python3 .github/scripts/conferir_base.py
      # [kit:stack=python-fastapi]
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # [kit:fim]
      # [kit:stack=node-ts]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # [kit:fim]
      - name: As dependências
        run: {{CMD_CI_INSTALAR_JSON}}
      - name: O formato
        run: {{CMD_FORMATAR_CHECK_JSON}}
      - name: O lint
        run: {{CMD_LINT_JSON}}
      - name: O smoke
        run: {{CMD_SMOKE_JSON}}
      - name: Os testes
        run: {{CMD_TESTES_JSON}}
  # [kit:docker=sim]

  # A imagem: a verificação que mora no build precisa do build no CI. Constrói com --pull (sem ele, a imagem base sai
  # do cache, velha), sobe o contêiner e confere que o /health responde e declara a procedência. Não publica nada:
  # quem publica é o publicar-imagem.yml, na tag. Job à parte, com teto próprio, para o build não comer os 3 minutos.
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: O build
        run: docker build --pull --build-arg VERSAO=ci --build-arg COMMIT="${GITHUB_SHA::7}" -t {{NOME}}:ci .
      - name: A imagem sobe e responde
        shell: bash
        run: |
          docker run -d --name app -p 127.0.0.1:{{PORTA}}:{{PORTA}} {{NOME}}:ci
          for i in $(seq 1 30); do
            corpo="$(curl -fsS http://127.0.0.1:{{PORTA}}/health)" && break
            sleep 1
          done
          echo "$corpo"
          esperado='{"status": "ok", "versao": "ci", "commit": "'"${GITHUB_SHA::7}"'"}'
          python3 -c 'import json,sys; c=json.loads(sys.argv[1]); assert c==json.loads(sys.argv[2]), c' "${corpo:-null}" "$esperado" \
            || { docker logs app; exit 1; }
  # [kit:fim]
